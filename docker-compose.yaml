services:
  go-list-postgres:
    image: postgres:15-alpine
    container_name: go-list-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - ${PROJECT_ROOT}/out/pgdata:/var/lib/postgresql
    restart: always
  go-list-postgres-migrate:
    image: migrate/migrate:v4.19.1
    volumes:
      - ${PROJECT_ROOT}/migrations:/migrations
  go-list-port-forwarder:
    image: alpine/socat:1.8.0.3
    container_name: golist-postgres-port-forwarder
    command: tcp-listen:5432,fork,reuseaddr tcp-connect:go-list-postgres:5432
    ports:
      - "127.0.0.1:5432:5432"